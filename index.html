<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mihinadee Motors | Premium Car Care & Modifications</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Side-by-Side Product Grid for Mobile & Desktop */
        .product-grid-2col {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 15px;
        }

        .product-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 14px;
            padding: 10px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
        }

        /* Image Carousel Slider */
        .slider-container {
            position: relative;
            width: 100%;
            height: 130px;
            overflow: hidden;
            border-radius: 10px;
            margin-bottom: 8px;
        }

        .slider-track {
            display: flex;
            height: 100%;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scrollbar-width: none; /* Firefox */
        }

        .slider-track::-webkit-scrollbar {
            display: none; /* Chrome/Safari */
        }

        .slider-track img {
            min-width: 100%;
            height: 100%;
            object-fit: cover;
            scroll-snap-align: start;
        }

        .product-info {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-info h3 {
            font-size: 0.85rem;
            color: #ffffff;
            margin: 0 0 4px 0;
            line-height: 1.2;
        }

        .product-info p {
            font-size: 0.75rem;
            color: #cccccc;
            margin-bottom: 8px;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .price {
            font-size: 0.9rem;
            font-weight: bold;
            color: #d4af37;
            margin-bottom: 8px;
        }

        .btn-gold-sm {
            background: linear-gradient(135deg, #d4af37, #aa820a);
            color: #000;
            border: none;
            padding: 6px 8px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            font-size: 0.75rem;
            margin-top: auto;
        }

        /* Floating WhatsApp Button */
        .floating-whatsapp {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background-color: #25d366;
            color: #ffffff;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            z-index: 9999;
            transition: transform 0.3s ease;
            text-decoration: none;
        }

        .floating-whatsapp:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">MIHINADEE <span>MOTORS</span></div>
        <button class="menu-toggle" onclick="toggleMenu()" aria-label="Toggle Navigation">☰</button>
        <nav id="nav-menu">
            <a href="index.html" class="active">Home</a>
            <a href="services.html">Services</a>
            <a href="products.html">Products</a>
            <a href="vehicle-checker.html">AI Specs Checker</a>
            <a href="gallery.html">Gallery</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main class="container">
        <section class="products-section">
            <div class="section-header-wrap">
                <h2 class="section-title">Our Featured Products</h2>
                <div class="ios-search-bar" style="margin-top: 10px;">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Search products...">
                </div>
            </div>
            
            <div id="liveProductGrid" class="product-grid-2col">
                <p style="grid-column: span 2; text-align:center; color: var(--text-muted);">Loading products...</p>
            </div>
        </section>
    </main>

    <!-- Floating WhatsApp Button -->
    <a href="https://wa.me/94752541337" class="floating-whatsapp" target="_blank" aria-label="Contact on WhatsApp">
        <i class="fab fa-whatsapp"></i>
    </a>

    <footer>
        <p>&copy; 2026 Mihinadee Motors. All Rights Reserved.</p>
    </footer>

    <!-- Firebase Realtime Database SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBzyvbPzwrbO_-S1q0kQC1BIIcWONSiCFE",
            authDomain: "mihindee-motors.firebaseapp.com",
            databaseURL: "https://mihindee-motors-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "mihindee-motors",
            storageBucket: "mihindee-motors.firebasestorage.app",
            messagingSenderId: "155394892185",
            appId: "1:155394892185:web:9c0a7963685edb78bcf308"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        onValue(ref(db, 'products'), (snapshot) => {
            const grid = document.getElementById('liveProductGrid');
            grid.innerHTML = '';

            if (!snapshot.exists()) {
                grid.innerHTML = '<p style="grid-column: span 2; text-align:center; color: var(--text-muted);">No products currently available.</p>';
                return;
            }

            const data = snapshot.val();
            Object.keys(data).forEach((key) => {
                const p = data[key];
                const images = (p.images && p.images.length > 0) ? p.images : ['https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=600&q=80'];
                const isOut = p.outOfStock;
                const pDesc = p.desc ? p.desc : 'High quality automotive product.';

                // Build image slider elements
                let imgHtml = '';
                images.forEach(img => {
                    imgHtml += `<img src="${img}" alt="${p.title}">`;
                });

                grid.innerHTML += `
                    <div class="product-card ${isOut ? 'out-of-stock-card' : ''}">
                        <div class="slider-container">
                            <div class="slider-track">
                                ${imgHtml}
                            </div>
                        </div>
                        <div class="product-info">
                            <h3>${p.title} ${isOut ? '<br><span style="color:#e74c3c; font-size: 0.7rem;">(Out of Stock)</span>' : ''}</h3>
                            <p>${pDesc}</p>
                            <span class="price">${p.price}</span>
                            ${isOut 
                                ? `<button class="btn-gold-sm" style="opacity: 0.5; cursor: not-allowed;" disabled>Out of Stock</button>` 
                                : `<a href="https://wa.me/94752541337?text=I%20am%20interested%20in%20${encodeURIComponent(p.title)}" class="btn-gold-sm" target="_blank"><i class="fab fa-whatsapp"></i> Inquire</a>`
                            }
                        </div>
                    </div>`;
            });
        });

        document.getElementById('searchInput').addEventListener('keyup', function() {
            let filterValue = this.value.toLowerCase();
            let cards = document.querySelectorAll('.product-card');
            cards.forEach(card => {
                let text = card.textContent.toLowerCase();
                card.style.display = text.includes(filterValue) ? "flex" : "none";
            });
        });
    </script>

    <script>
        function toggleMenu() {
            var nav = document.getElementById('nav-menu');
            var btn = document.querySelector('.menu-toggle');
            if (nav) {
                nav.classList.toggle('show');
                if (btn) btn.innerHTML = nav.classList.contains('show') ? '✕' : '☰';
            }
        }
    </script>
</body>
</html>
