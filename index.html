<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mihinadee Motors | Premium Car Care & Modifications</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header>
        <div class="logo">MIHINADEE <span>MOTORS</span></div>
        <button class="menu-toggle" onclick="toggleMenu()" aria-label="Toggle Navigation">☰</button>
        <nav id="nav-menu">
            <a href="index.html" class="active">Home</a>
            <a href="services.html">Services</a>
            <a href="products.html">Products</a>
            <a href="vehicle-checker.html">AI Specs Checker</a>
            <a href="projects.html">Projects</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main class="container">
        <section class="products-section">
            <div class="section-header-wrap">
                <h2 class="section-title">Our Featured Products</h2>
                <div class="ios-search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Search products...">
                </div>
            </div>
            
            <div id="liveProductGrid" class="product-grid-2col">
                <p style="grid-column: span 2; text-align:center; color: var(--text-muted);">Loading products...</p>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Mihinadee Motors. All Rights Reserved.</p>
    </footer>

    <!-- Firebase Realtime Database SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBzyvbPzwrbO_-S1q0kQC1BIIcWONSiCFE",
            authDomain: "mihindee-motors.firebaseapp.com",
            databaseURL: "https://mihindee-motors-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "mihindee-motors",
            storageBucket: "mihindee-motors.firebasestorage.app",
            messagingSenderId: "155394892185",
            appId: "1:155394892185:web:9c0a7963685edb78bcf308"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        onValue(ref(db, 'products'), (snapshot) => {
            const grid = document.getElementById('liveProductGrid');
            grid.innerHTML = '';

            if (!snapshot.exists()) {
                grid.innerHTML = '<p style="grid-column: span 2; text-align:center; color: var(--text-muted);">No products currently available.</p>';
                return;
            }

            const data = snapshot.val();
            Object.keys(data).forEach((key) => {
                const p = data[key];
                const imgUrl = (p.images && p.images.length > 0) ? p.images[0] : 'https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=600&q=80';
                const isOut = p.outOfStock;
                const pDesc = p.desc ? p.desc : 'High quality automotive product for your vehicle.';

                grid.innerHTML += `
                    <div class="product-card ${isOut ? 'out-of-stock-card' : ''}">
                        <img src="${imgUrl}" alt="${p.title}">
                        <div class="product-info">
                            <h3>${p.title} ${isOut ? '<span class="out-tag">Out of Stock</span>' : ''}</h3>
                            <p>${pDesc}</p>
                            <span class="price">${p.price}</span>
                            
                            <div class="product-actions" style="display: flex; gap: 8px; margin-top: 10px;">
                                ${isOut 
                                    ? `<button class="btn-gold-sm disabled-btn" style="width: 100%;" disabled>Out of Stock</button>` 
                                    : `
                                        <a href="https://wa.me/94752541337?text=Hi%2C%20I%20would%20like%20to%20order%20${encodeURIComponent(p.title)}" class="btn-gold-sm" target="_blank" style="flex: 1; text-align: center; display: flex; align-items: center; justify-content: center; gap: 5px;">
                                            <i class="fab fa-whatsapp"></i> WhatsApp Order
                                        </a>
                                        <button onclick="addToCart('${p.title}', '${p.price}')" class="btn-gold-sm" style="padding: 0 12px; display: flex; align-items: center; justify-content: center;">
                                            <i class="fas fa-shopping-cart"></i>
                                        </button>
                                    `
                                }
                            </div>
                        </div>
                    </div>`;
            });
        });

        document.getElementById('searchInput').addEventListener('keyup', function() {
            let filterValue = this.value.toLowerCase();
            let cards = document.querySelectorAll('.product-card');
            cards.forEach(card => {
                let text = card.textContent.toLowerCase();
                card.style.display = text.includes(filterValue) ? "flex" : "none";
            });
        });
    </script>

    <script>
        function toggleMenu() {
            var nav = document.getElementById('nav-menu');
            var btn = document.querySelector('.menu-toggle');
            if (nav) {
                nav.classList.toggle('show');
                if (btn) btn.innerHTML = nav.classList.contains('show') ? '✕' : '☰';
            }
        }

        function addToCart(title, price) {
            alert(title + " added to cart!");
        }
    </script>
</body>
</html>
