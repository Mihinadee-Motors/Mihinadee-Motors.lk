<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mihinadee Motors | Products & Booking</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .ios-product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }

        .ios-product-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 18px;
            padding: 16px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .ios-product-card:hover {
            border-color: #d4af37;
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .ios-product-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 12px;
        }

        .ios-product-info {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .ios-product-info h3 {
            font-size: 1.1rem;
            color: #ffffff;
            margin: 0 0 8px 0;
        }

        .ios-product-info p {
            color: #cccccc;
            font-size: 0.85rem;
            line-height: 1.4;
            margin-bottom: 12px;
            flex-grow: 1;
        }

        .ios-product-price {
            font-size: 1.2rem;
            font-weight: bold;
            color: #d4af37;
            margin-bottom: 12px;
        }

        .ios-btn-group {
            display: flex;
            gap: 8px;
        }

        .ios-btn-gold {
            background: linear-gradient(135deg, #d4af37, #aa820a);
            color: #000;
            border: none;
            padding: 10px 14px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 0.85rem;
            flex: 1;
            transition: opacity 0.2s;
        }

        .ios-btn-gold:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">MIHINADEE <span>MOTORS</span></div>
        <button class="menu-toggle" onclick="toggleMenu()" aria-label="Toggle Navigation">☰</button>
        <nav id="nav-menu">
            <a href="index.html">Home</a>
            <a href="services.html">Services</a>
            <a href="products.html" class="active">Products</a>
            <a href="vehicle-checker.html">AI Specs Checker</a>
            <a href="projects.html">Projects</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main class="container">
        <section class="products-section">
            <div class="section-header-wrap">
                <h2 class="section-title">Store & Accessories</h2>
                <div class="ios-search-bar" style="margin-top: 15px;">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Search products (e.g., LED, Alarm, Tint)...">
                </div>
            </div>

            <div id="liveProductGrid" class="ios-product-grid">
                <p style="grid-column: 1/-1; text-align:center; color: var(--text-muted);">Loading products...</p>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Mihinadee Motors. All Rights Reserved.</p>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBzyvbPzwrbO_-S1q0kQC1BIIcWONSiCFE",
            authDomain: "mihindee-motors.firebaseapp.com",
            databaseURL: "https://mihindee-motors-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "mihindee-motors",
            storageBucket: "mihindee-motors.firebasestorage.app",
            messagingSenderId: "155394892185",
            appId: "1:155394892185:web:9c0a7963685edb78bcf308"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        onValue(ref(db, 'products'), (snapshot) => {
            const grid = document.getElementById('liveProductGrid');
            grid.innerHTML = '';

            if (!snapshot.exists()) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color: var(--text-muted);">No products available right now.</p>';
                return;
            }

            const data = snapshot.val();
            Object.keys(data).forEach((key) => {
                const p = data[key];
                const imgUrl = (p.images && p.images.length > 0) ? p.images[0] : 'https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=600&q=80';
                const isOut = p.outOfStock;
                const pDesc = p.desc ? p.desc : 'High quality automotive product for your vehicle.';

                grid.innerHTML += `
                    <div class="ios-product-card">
                        <img src="${imgUrl}" alt="${p.title}">
                        <div class="ios-product-info">
                            <h3>${p.title} ${isOut ? '<span style="color:#e74c3c; font-size: 0.75rem;">(Out of Stock)</span>' : ''}</h3>
                            <p>${pDesc}</p>
                            <div class="ios-product-price">${p.price}</div>
                            <div class="ios-btn-group">
                                ${isOut 
                                    ? `<button class="ios-btn-gold" style="opacity: 0.5; cursor: not-allowed;" disabled>Out of Stock</button>` 
                                    : `<a href="https://wa.me/94752541337?text=I%20am%20interested%20in%20${encodeURIComponent(p.title)}" class="ios-btn-gold" target="_blank"><i class="fab fa-whatsapp"></i> Inquire / Order</a>`
                                }
                            </div>
                        </div>
                    </div>`;
            });
        });

        document.getElementById('searchInput').addEventListener('keyup', function() {
            let filterValue = this.value.toLowerCase();
            let cards = document.querySelectorAll('.ios-product-card');
            cards.forEach(card => {
                let text = card.textContent.toLowerCase();
                card.style.display = text.includes(filterValue) ? "flex" : "none";
            });
        });
    </script>

    <script>
        function toggleMenu() {
            var nav = document.getElementById('nav-menu');
            var btn = document.querySelector('.menu-toggle');
            if (nav) {
                nav.classList.toggle('show');
                if (btn) btn.innerHTML = nav.classList.contains('show') ? '✕' : '☰';
            }
        }
    </script>
</body>
</html>
