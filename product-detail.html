<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | Mihinadee Motors</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .product-detail-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 18px;
            padding: 20px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            margin-top: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .main-image-container {
            width: 100%;
            height: 280px;
            border-radius: 14px;
            overflow: hidden;
            margin-bottom: 15px;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }

        .main-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .thumbnail-grid {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 20px;
            scrollbar-width: none;
        }

        .thumbnail-grid::-webkit-scrollbar {
            display: none;
        }

        .thumbnail-grid img {
            width: 65px;
            height: 65px;
            border-radius: 8px;
            object-fit: cover;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s ease;
        }

        .thumbnail-grid img.active {
            border-color: #d4af37;
        }

        .detail-title {
            color: #ffffff;
            font-size: 1.4rem;
            margin: 0 0 10px 0;
        }

        .detail-price {
            font-size: 1.5rem;
            color: #d4af37;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .detail-desc {
            color: #cccccc;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 25px;
            white-space: pre-line;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-outline-gold {
            background: transparent;
            border: 1px solid #d4af37;
            color: #d4af37;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .btn-outline-gold:hover {
            background: rgba(212, 175, 55, 0.1);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">MIHINADEE <span>MOTORS</span></div>
        <button class="menu-toggle" onclick="toggleMenu()" aria-label="Toggle Navigation">☰</button>
        <nav id="nav-menu">
            <a href="index.html">Home</a>
            <a href="services.html">Services</a>
            <a href="products.html" class="active">Products</a>
            <a href="vehicle-checker.html">AI Specs Checker</a>
            <a href="gallery.html">Gallery</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main class="container">
        <div id="productContainer" class="product-detail-card">
            <p style="text-align: center; color: var(--text-muted); padding: 40px 0;">Loading product details...</p>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Mihinadee Motors. All Rights Reserved.</p>
    </footer>

    <!-- Firebase Realtime Database SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBzyvbPzwrbO_-S1q0kQC1BIIcWONSiCFE",
            authDomain: "mihindee-motors.firebaseapp.com",
            databaseURL: "https://mihindee-motors-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "mihindee-motors",
            storageBucket: "mihindee-motors.firebasestorage.app",
            messagingSenderId: "155394892185",
            appId: "1:155394892185:web:9c0a7963685edb78bcf308"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');

        const container = document.getElementById('productContainer');

        if (!productId) {
            container.innerHTML = '<p style="text-align: center; color: #e74c3c;">Product not found.</p>';
        } else {
            onValue(ref(db, 'products/' + productId), (snapshot) => {
                if (!snapshot.exists()) {
                    container.innerHTML = '<p style="text-align: center; color: #e74c3c;">Product does not exist or has been removed.</p>';
                    return;
                }

                const p = snapshot.val();
                const images = (p.images && p.images.length > 0) ? p.images : ['https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=600&q=80'];
                const isOut = p.outOfStock;
                const pDesc = p.desc ? p.desc : 'High quality automotive product available at Mihinadee Motors.';

                // Build Thumbnails
                let thumbsHtml = '';
                images.forEach((img, index) => {
                    thumbsHtml += `<img src="${img}" class="${index === 0 ? 'active' : ''}" onclick="changeMainImage('${img}', this)" alt="Thumbnail">`;
                });

                container.innerHTML = `
                    <div class="main-image-container">
                        <img id="mainImage" src="${images[0]}" alt="${p.title}">
                    </div>
                    ${images.length > 1 ? `<div class="thumbnail-grid">${thumbsHtml}</div>` : ''}
                    
                    <h1 class="detail-title">${p.title} ${isOut ? '<span style="color:#e74c3c; font-size: 0.9rem;">(Out of Stock)</span>' : ''}</h1>
                    <div class="detail-price">${p.price}</div>
                    <div class="detail-desc">${pDesc}</div>

                    <div class="action-buttons">
                        ${isOut 
                            ? `<button class="btn-gold-sm" style="opacity: 0.5; width: 100%; padding: 14px; cursor: not-allowed;" disabled>Out of Stock</button>` 
                            : `
                                <a href="vehicle-checker.html?item=${encodeURIComponent(p.title)}&price=${encodeURIComponent(p.price)}" class="btn-outline-gold">
                                    <i class="fas fa-sliders-h"></i> Check Vehicle Fitment & Total Cost
                                </a>
                                <a href="https://api.whatsapp.com/send/?phone=94752541337&text=Hi%20Mihinadee%20Motors,%20I%20am%20interested%20in%20buying%20${encodeURIComponent(p.title)}%20(${encodeURIComponent(p.price)})" target="_blank" class="btn-gold-sm" style="padding: 14px; font-size: 0.95rem;">
                                    <i class="fab fa-whatsapp"></i> Buy Now via WhatsApp
                                </a>
                            `
                        }
                    </div>
                `;
            });
        }
    </script>

    <script>
        function changeMainImage(src, element) {
            document.getElementById('mainImage').src = src;
            let thumbs = document.querySelectorAll('.thumbnail-grid img');
            thumbs.forEach(t => t.classList.remove('active'));
            if (element) element.classList.add('active');
        }

        function toggleMenu() {
            var nav = document.getElementById('nav-menu');
            var btn = document.querySelector('.menu-toggle');
            if (nav) {
                nav.classList.toggle('show');
                if (btn) btn.innerHTML = nav.classList.contains('show') ? '✕' : '☰';
            }
        }
    </script>
</body>
</html>
