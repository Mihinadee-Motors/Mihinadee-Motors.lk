<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | Mihinadee Motors</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .product-detail-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 18px;
            padding: 20px;
            backdrop-filter: blur(12px);
            margin-top: 20px;
        }

        .main-img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 14px;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }

        .thumbs-wrap {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            overflow-x: auto;
        }

        .thumbs-wrap img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .thumbs-wrap img.active-thumb {
            border-color: #d4af37;
        }

        .product-title-lg {
            font-size: 1.6rem;
            color: #fff;
            margin-top: 0;
        }

        .price-lg {
            font-size: 1.5rem;
            color: #d4af37;
            font-weight: bold;
            margin: 10px 0;
        }

        .desc-text {
            color: #ccc;
            line-height: 1.6;
            font-size: 0.95rem;
        }

        .review-section {
            margin-top: 35px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 18px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .star-rating {
            display: flex;
            gap: 5px;
            font-size: 20px;
            color: #555;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .star-rating .fas.active {
            color: #d4af37;
        }

        .review-input, .review-textarea {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(212, 175, 55, 0.3);
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }

        .review-item {
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px 0;
        }

        .review-item:last-child {
            border-bottom: none;
        }

        .similar-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 15px;
        }

        .sim-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 12px;
            padding: 10px;
            text-decoration: none;
            color: #fff;
        }

        .sim-card img {
            width: 100%;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">MIHINADEE <span>MOTORS</span></div>
        <button class="menu-toggle" onclick="toggleMenu()" aria-label="Toggle Navigation">☰</button>
        <nav id="nav-menu">
            <a href="index.html">Home</a>
            <a href="services.html">Services</a>
            <a href="products.html">Products</a>
            <a href="vehicle-checker.html">AI Specs Checker</a>
            <a href="gallery.html">Gallery</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main class="container">
        <div id="productDetailContent" class="product-detail-container">
            <p style="color: #ccc; grid-column: 1/-1; text-align: center;">Loading product details...</p>
        </div>

        <!-- Review Section -->
        <section class="review-section">
            <h3 style="color: #d4af37; margin-top: 0;"><i class="fas fa-star"></i> Customer Reviews & Ratings</h3>
            
            <div style="margin-bottom: 20px;">
                <p style="color: #fff; margin-bottom: 5px;">Leave a Review:</p>
                <div class="star-rating" id="starInput">
                    <i class="fas fa-star" data-rating="1"></i>
                    <i class="fas fa-star" data-rating="2"></i>
                    <i class="fas fa-star" data-rating="3"></i>
                    <i class="fas fa-star" data-rating="4"></i>
                    <i class="fas fa-star" data-rating="5"></i>
                </div>
                <input type="text" id="reviewerName" class="review-input" placeholder="Your Name">
                <textarea id="reviewText" class="review-textarea" rows="3" placeholder="Write your review about this product/service..."></textarea>
                <button onclick="submitReview()" class="btn-gold-sm" style="padding: 10px 15px;">Submit Review</button>
            </div>

            <div id="reviewsList">
                <p style="color: #888;">No reviews yet. Be the first to review!</p>
            </div>
        </section>

        <!-- Similar Items -->
        <section style="margin-top: 40px;">
            <h3 style="color: #fff;"><i class="fas fa-boxes"></i> Similar Items</h3>
            <div id="similarGrid" class="similar-grid"></div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Mihinadee Motors. All Rights Reserved.</p>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBzyvbPzwrbO_-S1q0kQC1BIIcWONSiCFE",
            authDomain: "mihindee-motors.firebaseapp.com",
            databaseURL: "https://mihindee-motors-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "mihindee-motors",
            storageBucket: "mihindee-motors.firebasestorage.app",
            messagingSenderId: "155394892185",
            appId: "1:155394892185:web:9c0a7963685edb78bcf308"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');

        let selectedRating = 5;

        // Star Selection Logic
        document.querySelectorAll('#starInput i').forEach(star => {
            star.addEventListener('click', function() {
                selectedRating = this.getAttribute('data-rating');
                document.querySelectorAll('#starInput i').forEach((s, idx) => {
                    if (idx < selectedRating) s.classList.add('active');
                    else s.classList.remove('active');
                });
            });
        });
        // Default 5 star active
        document.querySelectorAll('#starInput i').forEach(s => s.classList.add('active'));

        if (!productId) {
            document.getElementById('productDetailContent').innerHTML = '<p style="color:#e74c3c;">Product not found.</p>';
        } else {
            // Load Product Details
            onValue(ref(db, 'products/' + productId), (snapshot) => {
                if (!snapshot.exists()) {
                    document.getElementById('productDetailContent').innerHTML = '<p style="color:#e74c3c;">Product does not exist.</p>';
                    return;
                }

                const p = snapshot.val();
                const images = (p.images && p.images.length > 0) ? p.images : ['https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=600&q=80'];
                
                let thumbsHtml = '';
                images.forEach((img, idx) => {
                    thumbsHtml += `<img src="${img}" class="${idx === 0 ? 'active-thumb' : ''}" onclick="changeMainImg('${img}', this)">`;
                });

                document.getElementById('productDetailContent').innerHTML = `
                    <div>
                        <img id="mainDisplayImg" src="${images[0]}" class="main-img" alt="${p.title}">
                        <div class="thumbs-wrap">${thumbsHtml}</div>
                    </div>
                    <div>
                        <h1 class="product-title-lg">${p.title}</h1>
                        <div class="price-lg">${p.price}</div>
                        <p class="desc-text">${p.desc ? p.desc : 'High quality automotive product available at Mihinadee Motors.'}</p>
                        <div style="margin-top: 20px;">
                            ${p.outOfStock 
                                ? `<button class="btn-gold-sm" style="opacity:0.5; width:100%; padding:12px;" disabled>Out of Stock</button>` 
                                : `<a href="https://wa.me/94752541337?text=I%20am%20interested%20in%20buying%20${encodeURIComponent(p.title)}" target="_blank" class="btn-gold-sm" style="width:100%; text-align:center; padding:12px; display:block; box-sizing:border-box;"><i class="fab fa-whatsapp"></i> Buy Now via WhatsApp</a>`
                            }
                        </div>
                    </div>
                `;
            });

            // Load Reviews
            onValue(ref(db, 'reviews/' + productId), (snapshot) => {
                const reviewsList = document.getElementById('reviewsList');
                reviewsList.innerHTML = '';

                if (!snapshot.exists()) {
                    reviewsList.innerHTML = '<p style="color: #888;">No reviews yet. Be the first to review!</p>';
                    return;
                }

                const data = snapshot.val();
                Object.keys(data).forEach(k => {
                    const r = data[k];
                    let stars = '';
                    for (let i = 0; i < 5; i++) {
                        stars += `<i class="fas fa-star" style="color: ${i < r.rating ? '#d4af37' : '#444'}; font-size:12px;"></i>`;
                    }
                    reviewsList.innerHTML += `
                        <div class="review-item">
                            <div style="display:flex; justify-between; align-items:center;">
                                <strong style="color:#fff; font-size:0.9rem;">${r.name}</strong>
                                <div>${stars}</div>
                            </div>
                            <p style="color:#ccc; font-size:0.85rem; margin:5px 0 0 0;">${r.text}</p>
                        </div>
                    `;
                });
            });

            // Load Similar Items
            onValue(ref(db, 'products'), (snapshot) => {
                const similarGrid = document.getElementById('similarGrid');
                similarGrid.innerHTML = '';
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    let count = 0;
                    Object.keys(data).forEach(k => {
                        if (k !== productId && count < 4) {
                            const item = data[k];
                            const img = (item.images && item.images.length > 0) ? item.images[0] : 'https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=600&q=80';
                            similarGrid.innerHTML += `
                                <a href="product-detail.html?id=${k}" class="sim-card">
                                    <img src="${img}" alt="${item.title}">
                                    <h4 style="font-size:0.8rem; margin:5px 0 2px 0; color:#fff;">${item.title}</h4>
                                    <span style="color:#d4af37; font-size:0.75rem; font-weight:bold;">${item.price}</span>
                                </a>
                            `;
                            count++;
                        }
                    });
                }
            });
        }

        window.submitReview = function() {
            const name = document.getElementById('reviewerName').value.trim();
            const text = document.getElementById('reviewText').value.trim();

            if (!name || !text) {
                alert('Please enter your name and review text.');
                return;
            }

            push(ref(db, 'reviews/' + productId), {
                name: name,
                text: text,
                rating: parseInt(selectedRating),
                timestamp: Date.now()
            }).then(() => {
                alert('Thank you for your review!');
                document.getElementById('reviewerName').value = '';
                document.getElementById('reviewText').value = '';
            });
        };

        window.changeMainImg = function(src, elem) {
            document.getElementById('mainDisplayImg').src = src;
            document.querySelectorAll('.thumbs-wrap img').forEach(i => i.classList.remove('active-thumb'));
            elem.classList.add('active-thumb');
        };
    </script>

    <script>
        function toggleMenu() {
            var nav = document.getElementById('nav-menu');
            if (nav) nav.classList.toggle('show');
        }
    </script>
</body>
</html>
