<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Mihinadee Motors</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .admin-card {
            max-width: 900px;
            margin: 20px auto;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .admin-title {
            color: #d4af37;
            text-align: center;
            margin-bottom: 20px;
        }
        .section-title {
            color: #d4af37;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            padding-bottom: 5px;
            margin-top: 30px;
            margin-bottom: 15px;
        }
        .grid-inputs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 10px;
        }
        .form-group label {
            font-size: 0.85rem;
            color: #cccccc;
            margin-bottom: 5px;
        }
        .form-control {
            padding: 10px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 8px;
            color: #ffffff;
            outline: none;
        }
        .btn-action {
            width: 100%;
            background: linear-gradient(135deg, #d4af37, #aa820a);
            color: #000;
            border: none;
            padding: 12px;
            font-weight: bold;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.3s;
        }
        .btn-action:hover {
            background: #ffffff;
            color: #000;
        }
        .image-preview-container {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .image-preview-container img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #d4af37;
        }
        .product-list {
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }
        .product-item {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(212, 175, 55, 0.2);
            padding: 15px;
            border-radius: 10px;
        }
        .product-item .img-gallery {
            display: flex;
            gap: 5px;
            overflow-x: auto;
            margin-bottom: 10px;
        }
        .product-item img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 6px;
        }
        .product-item h4 {
            margin: 5px 0;
            color: #d4af37;
        }
        .product-item p {
            margin: 3px 0;
            font-size: 0.85rem;
            color: #ddd;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .btn-delete {
            background: #c0392b;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
        }
        .status-msg {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
            color: #2ecc71;
            display: none;
        }
    </style>
</head>
<body>

    <div class="admin-card">
        <h2 class="admin-title"><i class="fas fa-user-shield"></i> Mihinadee Motors Admin Dashboard</h2>

        <!-- SECTION 1: Product Upload -->
        <div class="section-title"><i class="fas fa-box-open"></i> Upload New Product (Multiple Images)</div>
        <form id="productForm">
            <div class="grid-inputs">
                <div class="form-group">
                    <label>Product Name</label>
                    <input type="text" id="prodName" class="form-control" placeholder="e.g. Car Key Remote" required>
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <input type="text" id="prodCategory" class="form-control" placeholder="e.g. Alarm Systems" required>
                </div>
                <div class="form-group">
                    <label>Price (Rs.)</label>
                    <input type="number" id="prodPrice" class="form-control" placeholder="12500" required>
                </div>
            </div>
            
            <div class="form-group">
                <label><i class="fas fa-images"></i> Select Images (Select up to 10+ images)</label>
                <input type="file" id="prodImages" class="form-control" accept="image/*" multiple required>
                <div id="previewContainer" class="image-preview-container"></div>
            </div>

            <div class="form-group">
                <label>Description</label>
                <textarea id="prodDesc" class="form-control" rows="3" placeholder="Enter product details..."></textarea>
            </div>
            <button type="button" class="btn-action" id="saveProductBtn"><i class="fas fa-upload"></i> Upload & Sync Product</button>
        </form>

        <!-- SECTION 2: Product Inventory & Realtime Preview -->
        <div class="section-title"><i class="fas fa-list"></i> Realtime Product Inventory</div>
        <div id="productList" class="product-list">
            <p style="text-align:center; width:100%;">Loading products...</p>
        </div>

        <div id="statusMsg" class="status-msg">Operation completed successfully!</div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBzyvbPzwrbO_-S1q0kQC1BIIcWONSiCFE",
            authDomain: "mihindee-motors.firebaseapp.com",
            databaseURL: "https://mihindee-motors-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "mihindee-motors",
            storageBucket: "mihindee-motors.firebasestorage.app",
            messagingSenderId: "155394892185",
            appId: "1:155394892185:web:9c0a7963685edb78bcf308"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const fileInput = document.getElementById('prodImages');
        const previewContainer = document.getElementById('previewContainer');
        let selectedBase64Images = [];

        // Preview & Convert Images to Base64 Data
        fileInput.addEventListener('change', () => {
            previewContainer.innerHTML = '';
            selectedBase64Images = [];
            const files = Array.from(fileInput.files);

            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const base64Str = e.target.result;
                    selectedBase64Images.push(base64Str);

                    const img = document.createElement('img');
                    img.src = base64Str;
                    previewContainer.appendChild(img);
                };
                reader.readAsDataURL(file);
            });
        });

        // Upload Product Direct to Realtime Database
        document.getElementById('saveProductBtn').addEventListener('click', async () => {
            const name = document.getElementById('prodName').value;
            const category = document.getElementById('prodCategory').value;
            const price = Number(document.getElementById('prodPrice').value);
            const description = document.getElementById('prodDesc').value;

            if (!name || !price || selectedBase64Images.length === 0) {
                alert('Please fill all required fields and select at least one image.');
                return;
            }

            const btn = document.getElementById('saveProductBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Syncing...';

            try {
                const productData = { 
                    name, 
                    category, 
                    price, 
                    description, 
                    images: selectedBase64Images 
                };

                await push(ref(db, 'products'), productData);

                showSuccess();
                document.getElementById('productForm').reset();
                previewContainer.innerHTML = '';
                selectedBase64Images = [];
            } catch (error) {
                alert('Upload Error: ' + error.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-upload"></i> Upload & Sync Product';
            }
        });

        // Realtime Sync Products Across Devices
        const productListEl = document.getElementById('productList');
        onValue(ref(db, 'products'), (snapshot) => {
            productListEl.innerHTML = '';
            if (snapshot.exists()) {
                const data = snapshot.val();
                Object.keys(data).forEach(id => {
                    const item = data[id];
                    const imgs = item.images || [];
                    let imgGalleryHtml = '<div class="img-gallery">';
                    imgs.forEach(url => {
                        imgGalleryHtml += `<img src="${url}" alt="Product">`;
                    });
                    imgGalleryHtml += '</div>';

                    productListEl.innerHTML += `
                        <div class="product-item">
                            ${imgGalleryHtml}
                            <h4>${item.name || ''}</h4>
                            <p><strong>Category:</strong> ${item.category || ''}</p>
                            <p><strong>Price:</strong> Rs. ${item.price || 0}</p>
                            <p>${item.description || ''}</p>
                            <div class="btn-group">
                                <button class="btn-delete" onclick="deleteProduct('${id}')"><i class="fas fa-trash"></i> Delete</button>
                            </div>
                        </div>
                    `;
                });
            } else {
                productListEl.innerHTML = '<p style="text-align:center; width:100%;">No products found.</p>';
            }
        });

        window.deleteProduct = (id) => {
            if (confirm('Are you sure you want to delete this product?')) {
                remove(ref(db, 'products/' + id)).then(showSuccess);
            }
        };

        function showSuccess() {
            const statusMsg = document.getElementById('statusMsg');
            statusMsg.style.display = 'block';
            setTimeout(() => { statusMsg.style.display = 'none'; }, 3000);
        }
    </script>
</body>
</html>
