<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mihinadee Motors | Admin Panel</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-box {
            max-width: 600px;
            margin: 50px auto;
            padding: 30px;
            background: #f9f9f9;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border-top: 5px solid var(--primary-gold);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">MIHINADEE <span>MOTORS</span></div>
        <nav>
            <a href="index.html">Back to Main Site</a>
        </nav>
    </header>

    <div class="container">
        <!-- Password Login Section -->
        <div id="login-section" class="admin-box" style="text-align: center;">
            <h2>Admin Login</h2>
            <p style="margin-bottom: 20px; color: #666;">Enter secret password to access management tools.</p>
            <input type="password" id="admin-pass" placeholder="Enter Password" style="width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px;">
            <button onclick="checkAuth()" class="btn-gold" style="width: 100%;">Login to Admin Panel</button>
        </div>

        <!-- Hidden Admin Content -->
        <div id="admin-content" style="display: none;">
            <div class="admin-box">
                <h2 style="text-align: center; margin-bottom: 20px;">Add New Product</h2>
                <form id="add-product-form" onsubmit="saveProduct(event)">
                    <input type="text" id="p-title" placeholder="Product Title (e.g. LED Headlight Kit)" required>
                    <input type="text" id="p-price" placeholder="Price (e.g. Rs. 18,500)" required>
                    <input type="text" id="p-time" placeholder="Installation Time (e.g. 1 - 2 Hours)" required>
                    <label style="display: block; margin-bottom: 8px; font-weight: bold;">Select Image From Device:</label>
                    <input type="file" id="p-file" accept="image/*" required>
                    <button type="submit" class="btn-gold" style="width: 100%; margin-top: 10px;">+ Add Product</button>
                </form>
            </div>

            <h2 class="section-title" style="margin-top: 50px;">Manage Existing <span>Products</span></h2>
            <div class="grid" id="admin-products-grid"></div>
        </div>
    </div>

    <script>
        const defaultProducts = [
            {
                title: "Custom LED Headlight Kit",
                price: "Rs. 18,500",
                time: "1 - 2 Hours",
                img: "https://images.unsplash.com/photo-1511919884226-fd3cad34687c?auto=format&fit=crop&w=500&q=80"
            },
            {
                title: "Universal Sports Bodykit",
                price: "Rs. 65,000",
                time: "1 Full Day",
                img: "https://images.unsplash.com/photo-1617814076367-b759c7d7e738?auto=format&fit=crop&w=500&q=80"
            }
        ];

        function checkAuth() {
            const pass = document.getElementById('admin-pass').value;
            if (pass === "mihinadee123") { // Password එක වෙනස් කිරීමට නම් මෙතනින් කරන්න
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('admin-content').style.display = 'block';
                loadAdminProducts();
            } else {
                alert("Incorrect Password! Access Denied.");
            }
        }

        function loadAdminProducts() {
            let storedProducts = JSON.parse(localStorage.getItem('mm_products')) || defaultProducts;
            const grid = document.getElementById('admin-products-grid');
            grid.innerHTML = '';

            storedProducts.forEach((prod, index) => {
                grid.innerHTML += `
                    <div class="card" style="text-align: center;">
                        <img src="${prod.img}" alt="${prod.title}" style="width: 100%; height: 180px; object-fit: cover; border-radius: 5px; margin-bottom: 15px;">
                        <h3>${prod.title}</h3>
                        <p style="color: var(--primary-gold); font-weight: bold;">${prod.price}</p>
                        <p style="font-size: 14px; color: #666;">Time: ${prod.time}</p>
                        <button onclick="removeProduct(${index})" style="background: #ff4d4d; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; margin-top: 10px;">Delete Product</button>
                    </div>
                `;
            });
        }

        function saveProduct(e) {
            e.preventDefault();
            const title = document.getElementById('p-title').value;
            const price = document.getElementById('p-price').value;
            const time = document.getElementById('p-time').value;
            const file = document.getElementById('p-file').files[0];

            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    let storedProducts = JSON.parse(localStorage.getItem('mm_products')) || defaultProducts;
                    storedProducts.push({ title, price, time, img: e.target.result });
                    localStorage.setItem('mm_products', JSON.stringify(storedProducts));
                    
                    document.getElementById('add-product-form').reset();
                    alert('Product added successfully!');
                    loadAdminProducts();
                };
                reader.readAsDataURL(file);
            }
        }

        function removeProduct(index) {
            if (confirm("Are you sure you want to delete this product?")) {
                let storedProducts = JSON.parse(localStorage.getItem('mm_products')) || defaultProducts;
                storedProducts.splice(index, 1);
                localStorage.setItem('mm_products', JSON.stringify(storedProducts));
                loadAdminProducts();
            }
        }
    </script>
</body>
</html>
