<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Mihinadee Motors</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header>
        <div class="logo">MIHINADEE <span>ADMIN</span></div>
        <nav><a href="index.html" target="_blank">View Live Site</a></nav>
    </header>

    <main class="container">
        <!-- Add / Edit Form -->
        <div class="admin-card">
            <h2 id="formTitle">Add New Product</h2>
            <p class="admin-subtitle">Upload up to 4 images and manage live stock instantly.</p>

            <form id="productForm" onsubmit="saveProduct(event)">
                <input type="hidden" id="editDocId" value="">

                <div class="form-group">
                    <label>Title / Product Name</label>
                    <input type="text" id="pTitle" placeholder="e.g. Nano Ceramic Tinting" required>
                </div>

                <div class="form-group">
                    <label>Price</label>
                    <input type="text" id="pPrice" placeholder="e.g. From LKR 15,000" required>
                </div>

                <div class="form-group">
                    <label>Description</label>
                    <textarea id="pDesc" rows="3" placeholder="Enter product details..." required></textarea>
                </div>

                <div class="form-group">
                    <label>Upload Images (Up to 4)</label>
                    <input type="file" id="pImages" accept="image/*" multiple onchange="previewImages(event)">
                </div>

                <!-- Preview Grid -->
                <div class="preview-section">
                    <label>Selected Previews:</label>
                    <div id="previewGrid" class="preview-grid">
                        <span class="no-preview">No images selected</span>
                    </div>
                </div>

                <div class="form-group-checkbox">
                    <label>
                        <input type="checkbox" id="pOutOfStock"> Mark as Out of Stock
                    </label>
                </div>

                <button type="submit" class="btn-gold-admin" id="saveBtn">
                    <i class="fas fa-plus-circle"></i> Save Product to Firebase
                </button>
            </form>
        </div>

        <!-- Current Live Products -->
        <div class="admin-card">
            <h2>Live Firebase Products</h2>
            <div id="adminProductList" class="admin-product-list">
                <p style="text-align: center; font-size: 13px; color: var(--text-muted);">Loading live products...</p>
            </div>
        </div>
    </main>

    <!-- Firebase SDK Modules -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentImageBase64List = [];
        let fetchedProducts = [];

        // Preview local images before uploading
        window.previewImages = function(e) {
            const files = Array.from(e.target.files).slice(0, 4);
            const grid = document.getElementById('previewGrid');
            grid.innerHTML = '';
            currentImageBase64List = [];

            if (files.length === 0) {
                grid.innerHTML = '<span class="no-preview">No images selected</span>';
                return;
            }

            files.forEach((file, idx) => {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    currentImageBase64List.push(evt.target.result);
                    grid.innerHTML += `
                        <div class="preview-item">
                            <img src="${evt.target.result}">
                            <span class="image-number">Img ${idx + 1}</span>
                        </div>`;
                }
                reader.readAsDataURL(file);
            });
        };

        // Save / Update Document in Firestore
        window.saveProduct = async function(e) {
            e.preventDefault();
            const saveBtn = document.getElementById('saveBtn');
            saveBtn.disabled = true;
            saveBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';

            const editDocId = document.getElementById('editDocId').value;
            const title = document.getElementById('pTitle').value;
            const price = document.getElementById('pPrice').value;
            const desc = document.getElementById('pDesc').value;
            const outOfStock = document.getElementById('pOutOfStock').checked;

            let images = currentImageBase64List;
            if (images.length === 0 && editDocId) {
                const existing = fetchedProducts.find(p => p.id === editDocId);
                if (existing) images = existing.images;
            } else if (images.length === 0) {
                images = ["https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=600&q=80"];
            }

            const productData = { title, price, desc, images, outOfStock, updatedAt: new Date() };

            try {
                if (editDocId) {
                    await updateDoc(doc(db, "products", editDocId), productData);
                } else {
                    await addDoc(collection(db, "products"), productData);
                }
                resetForm();
            } catch (error) {
                console.error("Firebase Error: ", error);
                alert("Error saving data to Firebase!");
            } finally {
                saveBtn.disabled = false;
            }
        };

        // Real-time Listener for Products List
        onSnapshot(collection(db, "products"), (snapshot) => {
            fetchedProducts = [];
            const container = document.getElementById('adminProductList');
            container.innerHTML = '';

            if (snapshot.empty) {
                container.innerHTML = '<p style="text-align: center; font-size: 13px; color: var(--text-muted);">No products found in Database.</p>';
                return;
            }

            snapshot.forEach((docSnap) => {
                const p = docSnap.data();
                p.id = docSnap.id;
                fetchedProducts.push(p);

                container.innerHTML += `
                    <div class="admin-item-card ${p.outOfStock ? 'item-out' : ''}">
                        <img src="${(p.images && p.images[0]) ? p.images[0] : ''}" alt="Img">
                        <div class="admin-item-info">
                            <h4>${p.title} ${p.outOfStock ? '<span class="badge-out">[Out of Stock]</span>' : ''}</h4>
                            <p>${p.price}</p>
                        </div>
                        <div class="admin-item-actions">
                            <button onclick="toggleStock('${p.id}', ${p.outOfStock})" class="btn-stock">
                                ${p.outOfStock ? 'Set Available' : 'Set Out of Stock'}
                            </button>
                            <button onclick="editProduct('${p.id}')" class="btn-edit"><i class="fas fa-edit"></i></button>
                            <button onclick="deleteProduct('${p.id}')" class="btn-delete"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>`;
            });
        });

        window.editProduct = function(id) {
            const p = fetchedProducts.find(item => item.id === id);
            if (!p) return;
            document.getElementById('editDocId').value = p.id;
            document.getElementById('pTitle').value = p.title;
            document.getElementById('pPrice').value = p.price;
            document.getElementById('pDesc').value = p.desc;
            document.getElementById('pOutOfStock').checked = p.outOfStock;
            document.getElementById('formTitle').innerText = "Edit Product";
            document.getElementById('saveBtn').innerHTML = `<i class="fas fa-save"></i> Update Firebase Product`;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.deleteProduct = async function(id) {
            if (confirm("Delete this product permanently from Firebase?")) {
                await deleteDoc(doc(db, "products", id));
            }
        };

        window.toggleStock = async function(id, currentStatus) {
            await updateDoc(doc(db, "products", id), { outOfStock: !currentStatus });
        };

        function resetForm() {
            document.getElementById('productForm').reset();
            document.getElementById('editDocId').value = "";
            document.getElementById('formTitle').innerText = "Add New Product";
            document.getElementById('saveBtn').innerHTML = `<i class="fas fa-plus-circle"></i> Save Product to Firebase`;
            document.getElementById('previewGrid').innerHTML = '<span class="no-preview">No images selected</span>';
            currentImageBase64List = [];
        }
    </script>
</body>
</html>
