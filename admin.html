<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Mihinadee Motors</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header>
        <div class="logo">MIHINADEE <span>ADMIN</span></div>
        <nav>
            <a href="index.html">View Site</a>
        </nav>
    </header>

    <main class="container">
        <div class="admin-card">
            <h2>Add New Product / Project</h2>
            <p class="admin-subtitle">Upload up to 4 images and enter details before confirming.</p>

            <form id="adminForm" onsubmit="handleFormSubmit(event)">
                <!-- Title Input -->
                <div class="form-group">
                    <label for="itemTitle">Title / Name</label>
                    <input type="text" id="itemTitle" placeholder="e.g. Leather Seat Upgrade" required>
                </div>

                <!-- Price Input -->
                <div class="form-group">
                    <label for="itemPrice">Price / Starting From</label>
                    <input type="text" id="itemPrice" placeholder="e.g. From LKR 25,000" required>
                </div>

                <!-- Description Input -->
                <div class="form-group">
                    <label for="itemDescription">Description</label>
                    <textarea id="itemDescription" rows="4" placeholder="Enter detailed description..." required></textarea>
                </div>

                <!-- Multi Image Upload (Up to 4 Images) -->
                <div class="form-group">
                    <label>Upload Images (Select up to 4)</label>
                    <input type="file" id="imageInput" accept="image/*" multiple onchange="previewImages(event)">
                    <small class="hint">You can choose up to 4 images at once.</small>
                </div>

                <!-- Pre-Confirmation Image Preview Grid -->
                <div class="preview-section">
                    <label>Image Previews (Before Confirming):</label>
                    <div id="imagePreviewGrid" class="preview-grid">
                        <span class="no-preview">No images selected yet.</span>
                    </div>
                </div>

                <!-- Confirm Submit Button -->
                <button type="submit" class="btn-gold-admin">
                    <i class="fas fa-check-circle"></i> Confirm & Save
                </button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Mihinadee Motors. Secret Admin Panel.</p>
    </footer>

    <script>
        let selectedFiles = [];

        function previewImages(event) {
            const previewContainer = document.getElementById('imagePreviewGrid');
            previewContainer.innerHTML = '';
            selectedFiles = Array.from(event.target.files).slice(0, 4); // Restrict to 4 images max

            if (selectedFiles.length === 0) {
                previewContainer.innerHTML = '<span class="no-preview">No images selected yet.</span>';
                return;
            }

            selectedFiles.forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const previewItem = document.createElement('div');
                    previewItem.className = 'preview-item';
                    previewItem.innerHTML = `
                        <img src="${e.target.result}" alt="Preview ${index + 1}">
                        <span class="image-number">Image ${index + 1}</span>
                    `;
                    previewContainer.appendChild(previewItem);
                }
                reader.readAsDataURL(file);
            });
        }

        function handleFormSubmit(event) {
            event.preventDefault();
            const title = document.getElementById('itemTitle').value;
            const price = document.getElementById('itemPrice').value;
            const desc = document.getElementById('itemDescription').value;

            alert(`Confirmed!\nTitle: ${title}\nPrice: ${price}\nImages Selected: ${selectedFiles.length}\nDescription: ${desc}`);
        }
    </script>
</body>
</html>
