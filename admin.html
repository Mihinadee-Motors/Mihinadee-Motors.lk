<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Mihinadee Motors</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .admin-card {
            max-width: 800px;
            margin: 20px auto;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .admin-title {
            color: #d4af37;
            text-align: center;
            margin-bottom: 20px;
        }
        .section-title {
            color: #d4af37;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            padding-bottom: 5px;
            margin-top: 20px;
            margin-bottom: 15px;
        }
        .grid-inputs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 15px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        .form-group label {
            font-size: 0.85rem;
            color: #cccccc;
            margin-bottom: 5px;
        }
        .form-control {
            padding: 10px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 8px;
            color: #ffffff;
            outline: none;
        }
        .btn-save {
            width: 100%;
            background: linear-gradient(135deg, #d4af37, #aa820a);
            color: #000;
            border: none;
            padding: 14px;
            font-weight: bold;
            font-size: 1rem;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 25px;
            transition: 0.3s;
        }
        .btn-save:hover {
            background: #ffffff;
            color: #000;
        }
        .status-msg {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
            color: #2ecc71;
            display: none;
        }
    </style>
</head>
<body>

    <div class="admin-card">
        <h2 class="admin-title"><i class="fas fa-user-shield"></i> Service Price Manager</h2>

        <form id="priceForm">
            <!-- 1. Lock & Winder Repair -->
            <div class="section-title"><i class="fas fa-key"></i> Lock & Winder Repair</div>
            <div class="grid-inputs">
                <div class="form-group">
                    <label>Vehicle Lock Repair (Rs.)</label>
                    <input type="number" id="lockRepairPrice" class="form-control" placeholder="2500">
                </div>
                <div class="form-group">
                    <label>Winder Repair (Rs.)</label>
                    <input type="number" id="winderRepairPrice" class="form-control" placeholder="3000">
                </div>
                <div class="form-group">
                    <label>Center Lock Repair (Rs.)</label>
                    <input type="number" id="centerLockPrice" class="form-control" placeholder="4500">
                </div>
            </div>

            <!-- 2. Upgrades & Security Systems -->
            <div class="section-title"><i class="fas fa-shield-alt"></i> Upgrades & Security Systems</div>
            <div class="grid-inputs">
                <div class="form-group">
                    <label>Power Windows Conversion (Rs.)</label>
                    <input type="number" id="powerWindowPrice" class="form-control" placeholder="28000">
                </div>
                <div class="form-group">
                    <label>Alarm System & Remote (Rs.)</label>
                    <input type="number" id="alarmSystemPrice" class="form-control" placeholder="12500">
                </div>
            </div>

            <!-- 3. Styling & Protection -->
            <div class="section-title"><i class="fas fa-paint-brush"></i> Styling & Protection</div>
            <div class="grid-inputs">
                <div class="form-group">
                    <label>Tinted Glass (Rs.)</label>
                    <input type="number" id="tintedGlassPrice" class="form-control" placeholder="8500">
                </div>
                <div class="form-group">
                    <label>Body Stickers (Rs.)</label>
                    <input type="number" id="bodyStickersPrice" class="form-control" placeholder="4500">
                </div>
                <div class="form-group">
                    <label>Headlight Stickers (Rs.)</label>
                    <input type="number" id="headlightStickersPrice" class="form-control" placeholder="2500">
                </div>
                <div class="form-group">
                    <label>Step Board Stickers (Rs.)</label>
                    <input type="number" id="stepBoardStickersPrice" class="form-control" placeholder="2000">
                </div>
            </div>

            <!-- 4. Interior & Exterior Fitting -->
            <div class="section-title"><i class="fas fa-car-side"></i> Interior & Exterior Fitting</div>
            <div class="grid-inputs">
                <div class="form-group">
                    <label>Seat Covers (Rs.)</label>
                    <input type="number" id="seatCoversPrice" class="form-control" placeholder="15000">
                </div>
                <div class="form-group">
                    <label>Door Visors (Rs.)</label>
                    <input type="number" id="doorVisorsPrice" class="form-control" placeholder="3500">
                </div>
                <div class="form-group">
                    <label>Chrome Items (Rs.)</label>
                    <input type="number" id="chromeItemsPrice" class="form-control" placeholder="4000">
                </div>
                <div class="form-group">
                    <label>Carpets (Rs.)</label>
                    <input type="number" id="carpetsPrice" class="form-control" placeholder="4500">
                </div>
                <div class="form-group">
                    <label>Door Handles (Rs.)</label>
                    <input type="number" id="doorHandlesPrice" class="form-control" placeholder="2500">
                </div>
                <div class="form-group">
                    <label>Wiper Blades (Rs.)</label>
                    <input type="number" id="wiperBladesPrice" class="form-control" placeholder="1800">
                </div>
                <div class="form-group">
                    <label>Badges & Clips (Rs.)</label>
                    <input type="number" id="badgesClipsPrice" class="form-control" placeholder="1200">
                </div>
            </div>

            <button type="button" class="btn-save" onclick="savePrices()"><i class="fas fa-save"></i> Save Prices to Firebase</button>
            <div id="statusMsg" class="status-msg">Prices updated successfully!</div>
        </form>
    </div>

    <!-- Firebase Realtime Database SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBzyvbPzwrbO_-S1q0kQC1BIIcWONSiCFE",
            authDomain: "mihindee-motors.firebaseapp.com",
            databaseURL: "https://mihindee-motors-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "mihindee-motors",
            storageBucket: "mihindee-motors.firebasestorage.app",
            messagingSenderId: "155394892185",
            appId: "1:155394892185:web:9c0a7963685edb78bcf308"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Fetch existing prices from Firebase and populate inputs
        onValue(ref(db, 'servicePrices'), (snapshot) => {
            if (snapshot.exists()) {
                const data = snapshot.val();
                document.getElementById('lockRepairPrice').value = data.lockRepairPrice || 2500;
                document.getElementById('winderRepairPrice').value = data.winderRepairPrice || 3000;
                document.getElementById('centerLockPrice').value = data.centerLockPrice || 4500;
                document.getElementById('powerWindowPrice').value = data.powerWindowPrice || 28000;
                document.getElementById('alarmSystemPrice').value = data.alarmSystemPrice || 12500;
                document.getElementById('tintedGlassPrice').value = data.tintedGlassPrice || 8500;
                document.getElementById('bodyStickersPrice').value = data.bodyStickersPrice || 4500;
                document.getElementById('headlightStickersPrice').value = data.headlightStickersPrice || 2500;
                document.getElementById('stepBoardStickersPrice').value = data.stepBoardStickersPrice || 2000;
                document.getElementById('seatCoversPrice').value = data.seatCoversPrice || 15000;
                document.getElementById('doorVisorsPrice').value = data.doorVisorsPrice || 3500;
                document.getElementById('chromeItemsPrice').value = data.chromeItemsPrice || 4000;
                document.getElementById('carpetsPrice').value = data.carpetsPrice || 4500;
                document.getElementById('doorHandlesPrice').value = data.doorHandlesPrice || 2500;
                document.getElementById('wiperBladesPrice').value = data.wiperBladesPrice || 1800;
                document.getElementById('badgesClipsPrice').value = data.badgesClipsPrice || 1200;
            }
        });

        // Save new prices to Firebase
        window.savePrices = function() {
            const updatedData = {
                lockRepairPrice: Number(document.getElementById('lockRepairPrice').value),
                winderRepairPrice: Number(document.getElementById('winderRepairPrice').value),
                centerLockPrice: Number(document.getElementById('centerLockPrice').value),
                powerWindowPrice: Number(document.getElementById('powerWindowPrice').value),
                alarmSystemPrice: Number(document.getElementById('alarmSystemPrice').value),
                tintedGlassPrice: Number(document.getElementById('tintedGlassPrice').value),
                bodyStickersPrice: Number(document.getElementById('bodyStickersPrice').value),
                headlightStickersPrice: Number(document.getElementById('headlightStickersPrice').value),
                stepBoardStickersPrice: Number(document.getElementById('stepBoardStickersPrice').value),
                seatCoversPrice: Number(document.getElementById('seatCoversPrice').value),
                doorVisorsPrice: Number(document.getElementById('doorVisorsPrice').value),
                chromeItemsPrice: Number(document.getElementById('chromeItemsPrice').value),
                carpetsPrice: Number(document.getElementById('carpetsPrice').value),
                doorHandlesPrice: Number(document.getElementById('doorHandlesPrice').value),
                wiperBladesPrice: Number(document.getElementById('wiperBladesPrice').value),
                badgesClipsPrice: Number(document.getElementById('badgesClipsPrice').value)
            };

            set(ref(db, 'servicePrices'), updatedData)
                .then(() => {
                    const statusMsg = document.getElementById('statusMsg');
                    statusMsg.style.display = 'block';
                    setTimeout(() => { statusMsg.style.display = 'none'; }, 3000);
                })
                .catch((error) => {
                    alert("Error saving prices: " + error.message);
                });
        };
    </script>
</body>
</html>
