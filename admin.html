<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Mihinadee Motors</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .service-pricing-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        .service-price-card {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(212, 175, 55, 0.2);
            padding: 15px;
            border-radius: 12px;
        }
        .service-price-card label {
            display: block;
            color: #d4af37;
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .service-price-card input {
            width: 100%;
            padding: 10px;
            background: #000;
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 8px;
            color: #fff;
            box-sizing: border-box;
            outline: none;
        }
        .service-price-card input:focus {
            border-color: #d4af37;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">MIHINADEE <span>ADMIN</span></div>
        <nav><a href="index.html" target="_blank">View Live Site</a></nav>
    </header>

    <main class="container">
        <!-- Service Pricing Settings Section -->
        <div class="admin-card" style="margin-bottom: 25px;">
            <h2><i class="fas fa-tags" style="color: #d4af37;"></i> Manage All Service Rates</h2>
            <p class="admin-subtitle">Update base rates and per linear foot prices across all devices in real-time.</p>

            <form id="servicePricesForm" onsubmit="saveServicePrices(event)">
                <div class="service-pricing-grid">
                    <div class="service-price-card">
                        <label><i class="fas fa-film"></i> Tint Price per Linear Foot (Rs.)</label>
                        <input type="number" id="tintPricePerFoot" placeholder="e.g. 1200" required>
                    </div>

                    <div class="service-price-card">
                        <label><i class="fas fa-car-side"></i> Front Windshield Sunstrip (Rs.)</label>
                        <input type="number" id="frontWindshieldPrice" placeholder="e.g. 3500" required>
                    </div>

                    <div class="service-price-card">
                        <label><i class="fas fa-spray-can"></i> Nano Ceramic Coating (Rs.)</label>
                        <input type="number" id="nanoCeramicPrice" placeholder="e.g. 45000" required>
                    </div>

                    <div class="service-price-card">
                        <label><i class="fas fa-paint-roller"></i> Full Body Wrap Base Rate (Rs.)</label>
                        <input type="number" id="fullWrapPrice" placeholder="e.g. 150000" required>
                    </div>

                    <div class="service-price-card">
                        <label><i class="fas fa-sparkles"></i> Interior Detailing (Rs.)</label>
                        <input type="number" id="interiorDetailingPrice" placeholder="e.g. 18000" required>
                    </div>

                    <div class="service-price-card">
                        <label><i class="fas fa-lightbulb"></i> Headlight Restoration (Rs.)</label>
                        <input type="number" id="headlightPrice" placeholder="e.g. 4500" required>
                    </div>
                </div>

                <button type="submit" class="btn-gold-admin" id="savePricesBtn" style="margin-top: 20px;">
                    <i class="fas fa-sync-alt"></i> Save & Sync All Service Prices
                </button>
            </form>
        </div>

        <!-- Add / Edit Form -->
        <div class="admin-card">
            <h2 id="formTitle">Add New Product</h2>
            <p class="admin-subtitle">Manage products and live availability via Firebase Realtime Database.</p>

            <form id="productForm" onsubmit="saveProduct(event)">
                <input type="hidden" id="editDocId" value="">

                <div class="form-group">
                    <label>Title / Product Name</label>
                    <input type="text" id="pTitle" placeholder="e.g. Nano Ceramic Tinting" required>
                </div>

                <div class="form-group">
                    <label>Price</label>
                    <input type="text" id="pPrice" placeholder="e.g. From LKR 15,000" required>
                </div>

                <div class="form-group">
                    <label>Description</label>
                    <textarea id="pDesc" rows="3" placeholder="Enter product details..." required></textarea>
                </div>

                <div class="form-group">
                    <label>Upload Images (Up to 4)</label>
                    <input type="file" id="pImages" accept="image/*" multiple onchange="previewImages(event)">
                </div>

                <div class="preview-section">
                    <label>Selected Previews:</label>
                    <div id="previewGrid" class="preview-grid">
                        <span class="no-preview">No images selected</span>
                    </div>
                </div>

                <div class="form-group-checkbox">
                    <label>
                        <input type="checkbox" id="pOutOfStock"> Mark as Out of Stock
                    </label>
                </div>

                <button type="submit" class="btn-gold-admin" id="saveBtn">
                    <i class="fas fa-plus-circle"></i> Save Product
                </button>
            </form>
        </div>

        <!-- Current Live Products -->
        <div class="admin-card">
            <h2>Live Realtime Products</h2>
            <div id="adminProductList" class="admin-product-list">
                <p style="text-align: center; font-size: 13px; color: var(--text-muted);">Loading products...</p>
            </div>
        </div>
    </main>

    <!-- Firebase Realtime Database SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, set, update, remove, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBzyvbPzwrbO_-S1q0kQC1BIIcWONSiCFE",
            authDomain: "mihindee-motors.firebaseapp.com",
            databaseURL: "https://mihindee-motors-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "mihindee-motors",
            storageBucket: "mihindee-motors.firebasestorage.app",
            messagingSenderId: "155394892185",
            appId: "1:155394892185:web:9c0a7963685edb78bcf308"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let currentImageBase64List = [];
        let fetchedProducts = {};

        // 1. Fetch & Auto-Fill Current Service Prices from Firebase
        onValue(ref(db, 'servicePrices'), (snapshot) => {
            if (snapshot.exists()) {
                const rates = snapshot.val();
                if (rates.tintPricePerFoot) document.getElementById('tintPricePerFoot').value = rates.tintPricePerFoot;
                if (rates.frontWindshieldPrice) document.getElementById('frontWindshieldPrice').value = rates.frontWindshieldPrice;
                if (rates.nanoCeramicPrice) document.getElementById('nanoCeramicPrice').value = rates.nanoCeramicPrice;
                if (rates.fullWrapPrice) document.getElementById('fullWrapPrice').value = rates.fullWrapPrice;
                if (rates.interiorDetailingPrice) document.getElementById('interiorDetailingPrice').value = rates.interiorDetailingPrice;
                if (rates.headlightPrice) document.getElementById('headlightPrice').value = rates.headlightPrice;
            }
        });

        // 2. Save Service Prices Function
        window.saveServicePrices = async function(e) {
            e.preventDefault();
            const btn = document.getElementById('savePricesBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving Rates...';

            const serviceRates = {
                tintPricePerFoot: parseFloat(document.getElementById('tintPricePerFoot').value) || 0,
                frontWindshieldPrice: parseFloat(document.getElementById('frontWindshieldPrice').value) || 0,
                nanoCeramicPrice: parseFloat(document.getElementById('nanoCeramicPrice').value) || 0,
                fullWrapPrice: parseFloat(document.getElementById('fullWrapPrice').value) || 0,
                interiorDetailingPrice: parseFloat(document.getElementById('interiorDetailingPrice').value) || 0,
                headlightPrice: parseFloat(document.getElementById('headlightPrice').value) || 0,
                updatedAt: new Date().toISOString()
            };

            try {
                await set(ref(db, 'servicePrices'), serviceRates);
                alert("All Service Prices updated successfully across all devices!");
            } catch (err) {
                console.error("Error updating prices: ", err);
                alert("Failed to save service prices: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sync-alt"></i> Save & Sync All Service Prices';
            }
        };

        window.previewImages = function(e) {
            const files = Array.from(e.target.files).slice(0, 4);
            const grid = document.getElementById('previewGrid');
            grid.innerHTML = '';
            currentImageBase64List = [];

            if (files.length === 0) {
                grid.innerHTML = '<span class="no-preview">No images selected</span>';
                return;
            }

            files.forEach((file, idx) => {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    currentImageBase64List.push(evt.target.result);
                    grid.innerHTML += `
                        <div class="preview-item">
                            <img src="${evt.target.result}">
                            <span class="image-number">Img ${idx + 1}</span>
                        </div>`;
                }
                reader.readAsDataURL(file);
            });
        };

        window.saveProduct = async function(e) {
            e.preventDefault();
            const saveBtn = document.getElementById('saveBtn');
            saveBtn.disabled = true;
            saveBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';

            const editDocId = document.getElementById('editDocId').value;
            const title = document.getElementById('pTitle').value;
            const price = document.getElementById('pPrice').value;
            const desc = document.getElementById('pDesc').value;
            const outOfStock = document.getElementById('pOutOfStock').checked;

            let images = currentImageBase64List;
            if (images.length === 0 && editDocId && fetchedProducts[editDocId]) {
                images = fetchedProducts[editDocId].images || [];
            } else if (images.length === 0) {
                images = ["https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=600&q=80"];
            }

            const productData = { title, price, desc, images, outOfStock };

            try {
                if (editDocId) {
                    await update(ref(db, 'products/' + editDocId), productData);
                } else {
                    const newRef = push(ref(db, 'products'));
                    await set(newRef, productData);
                }
                resetForm();
            } catch (error) {
                console.error("Firebase Error: ", error);
                alert("Error saving data!");
            } finally {
                saveBtn.disabled = false;
            }
        };

        // Live Realtime Listener for Products
        onValue(ref(db, 'products'), (snapshot) => {
            const container = document.getElementById('adminProductList');
            container.innerHTML = '';
            fetchedProducts = snapshot.val() || {};

            if (!snapshot.exists()) {
                container.innerHTML = '<p style="text-align: center; font-size: 13px; color: var(--text-muted);">No products found in Database.</p>';
                return;
            }

            Object.keys(fetchedProducts).forEach((id) => {
                const p = fetchedProducts[id];
                container.innerHTML += `
                    <div class="admin-item-card ${p.outOfStock ? 'item-out' : ''}">
                        <img src="${(p.images && p.images[0]) ? p.images[0] : ''}" alt="Img">
                        <div class="admin-item-info">
                            <h4>${p.title} ${p.outOfStock ? '<span class="badge-out">[Out of Stock]</span>' : ''}</h4>
                            <p>${p.price}</p>
                        </div>
                        <div class="admin-item-actions">
                            <button onclick="toggleStock('${id}', ${p.outOfStock})" class="btn-stock">
                                ${p.outOfStock ? 'Set Available' : 'Set Out of Stock'}
                            </button>
                            <button onclick="editProduct('${id}')" class="btn-edit"><i class="fas fa-edit"></i></button>
                            <button onclick="deleteProduct('${id}')" class="btn-delete"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>`;
            });
        });

        window.editProduct = function(id) {
            const p = fetchedProducts[id];
            if (!p) return;
            document.getElementById('editDocId').value = id;
            document.getElementById('pTitle').value = p.title || '';
            document.getElementById('pPrice').value = p.price || '';
            document.getElementById('pDesc').value = p.desc || '';
            document.getElementById('pOutOfStock').checked = !!p.outOfStock;
            document.getElementById('formTitle').innerText = "Edit Product";
            document.getElementById('saveBtn').innerHTML = `<i class="fas fa-save"></i> Update Product`;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.deleteProduct = async function(id) {
            if (confirm("Delete this product permanently?")) {
                await remove(ref(db, 'products/' + id));
            }
        };

        window.toggleStock = async function(id, currentStatus) {
            await update(ref(db, 'products/' + id), { outOfStock: !currentStatus });
        };

        function resetForm() {
            document.getElementById('productForm').reset();
            document.getElementById('editDocId').value = "";
            document.getElementById('formTitle').innerText = "Add New Product";
            document.getElementById('saveBtn').innerHTML = `<i class="fas fa-plus-circle"></i> Save Product`;
            document.getElementById('previewGrid').innerHTML = '<span class="no-preview">No images selected</span>';
            currentImageBase64List = [];
        }
    </script>
</body>
</html>
