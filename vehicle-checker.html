<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Specs & Tint Calculator | Mihinadee Motors</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .checker-box {
            max-width: 750px;
            margin: 30px auto;
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-top: 5px solid #D4AF37;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #333;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 15px;
        }
        .glass-selection-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin: 15px 0;
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }
        .glass-option {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #333;
            cursor: pointer;
        }
        .glass-option input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        .ai-result {
            display: none;
            margin-top: 25px;
            background: #111;
            color: #fff;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #D4AF37;
        }
        .ai-result h3 {
            color: #D4AF37;
            margin-top: 0;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }
        .spec-item {
            margin-bottom: 12px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">MIHINADEE <span>MOTORS</span></div>
        <button class="menu-toggle" onclick="toggleMenu()">☰</button>
        <nav id="nav-menu">
            <a href="index.html">Home</a>
            <a href="services.html">Services</a>
            <a href="products.html">Products</a>
            <a href="vehicle-checker.html" class="active">AI Specs Checker</a>
            <a href="projects.html">Projects</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <div class="container">
        <div class="checker-box">
            <h2 style="text-align: center; color: #111;">🔍 AI Vehicle Specs & <span style="color:#D4AF37;">Tint Cost Calculator</span></h2>
            <p style="text-align: center; color: #666; font-size: 14px; margin-bottom: 20px;">Enter vehicle details, select target windows, and calculate total tinted area and cost instantly.</p>
            
            <div class="form-group">
                <label>Vehicle Make & Model</label>
                <input type="text" id="veh-model" placeholder="e.g. Toyota Vitz, Suzuki Alto, Honda Vezel">
            </div>

            <div class="form-group">
                <label>Year of Manufacture</label>
                <input type="text" id="veh-year" placeholder="e.g. 2018">
            </div>

            <div class="form-group">
                <label>Service Type</label>
                <select id="veh-service" onchange="toggleTintOptions()">
                    <option value="Tinting">Window Tinting</option>
                    <option value="Seat Covers">Seat Covers Fitting</option>
                    <option value="Full Interior Work">Full Interior (Tint + Seat Covers)</option>
                </select>
            </div>

            <!-- Tint Specific Section -->
            <div id="tint-custom-section">
                <label style="font-weight: bold; color: #333;">Select Windows for Tinting:</label>
                <div class="glass-selection-grid">
                    <label class="glass-option"><input type="checkbox" id="chk-front-doors" checked> Front Doors (2)</label>
                    <label class="glass-option"><input type="checkbox" id="chk-rear-doors" checked> Rear Doors (2)</label>
                    <label class="glass-option"><input type="checkbox" id="chk-front-windshield"> Front Windshield</label>
                    <label class="glass-option"><input type="checkbox" id="chk-rear-windshield" checked> Rear Windshield</label>
                    <label class="glass-option"><input type="checkbox" id="chk-quarter-glasses" checked> Quarter Glasses</label>
                    <label class="glass-option"><input type="checkbox" id="chk-sunroof"> Sunroof Glass</label>
                </div>

                <div class="form-group">
                    <label>Tinting Film Price per Sq. Ft. (LKR)</label>
                    <input type="number" id="tint-sqft-price" value="450" placeholder="e.g. 450">
                </div>
            </div>

            <button type="button" onclick="analyzeVehicle()" class="btn-gold" style="width: 100%; border: none; padding: 12px; font-size: 16px; cursor: pointer; font-weight: bold;">⚡ Analyze & Calculate Now</button>

            <!-- Result Box -->
            <div id="ai-result-box" class="ai-result">
                <h3><i class="fas fa-robot"></i> Vehicle Analysis & Cost Estimation</h3>
                <div class="spec-item" id="res-doors"></div>
                <div class="spec-item" id="res-specs"></div>
                <div class="spec-item" id="res-area"></div>
                <div class="spec-item" id="res-price"></div>
                <div class="spec-item" id="res-interchange"></div>
                
                <button type="button" onclick="sendAnalysisToWhatsApp()" class="btn-gold" style="width: 100%; margin-top: 15px; background: #25D366; color: white; border: none; cursor: pointer; font-weight: bold;">
                    <i class="fab fa-whatsapp"></i> Send Estimate to WhatsApp
                </button>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Mihinadee Motors. All Rights Reserved.</p>
    </footer>

    <script>
        function toggleMenu() {
            var nav = document.getElementById('nav-menu');
            if (nav) nav.classList.toggle('show');
        }

        function toggleTintOptions() {
            var service = document.getElementById('veh-service').value;
            var tintSec = document.getElementById('tint-custom-section');
            if (service === "Seat Covers") {
                tintSec.style.display = "none";
            } else {
                tintSec.style.display = "block";
            }
        }

        var currentEstimate = {};

        function analyzeVehicle() {
            var modelElem = document.getElementById('veh-model');
            var yearElem = document.getElementById('veh-year');
            var serviceElem = document.getElementById('veh-service');
            var sqftPriceElem = document.getElementById('tint-sqft-price');

            if (!modelElem || !modelElem.value.trim()) {
                alert("Please enter vehicle model!");
                return;
            }

            var model = modelElem.value.trim();
            var year = yearElem ? yearElem.value.trim() : "";
            var service = serviceElem ? serviceElem.value : "Tinting";
            var pricePerSqFt = (sqftPriceElem && sqftPriceElem.value) ? parseFloat(sqftPriceElem.value) : 450;

            var modelLower = model.toLowerCase();
            var bodyType = "Standard Hatchback / Sedan";
            var seatCompat = "Standard Front & Rear Split Seats";
            var fitTime = "2 - 3 Hours";

            // Default glass sizes in Sq. Ft.
            var sizeFrontDoors = 6.0;   
            var sizeRearDoors = 5.5;    
            var sizeFrontWind = 13.0;   
            var sizeRearWind = 8.5;     
            var sizeQuarter = 2.0;      
            var sizeSunroof = 4.0;      

            if (modelLower.indexOf("alto") !== -1 || modelLower.indexOf("kwid") !== -1 || modelLower.indexOf("maruti") !== -1 || modelLower.indexOf("mira") !== -1) {
                bodyType = "Compact Hatchback";
                seatCompat = "Compatible Covers: Alto, Maruti 800, KWID (Front bucket seats match)";
                sizeFrontDoors = 5.0; sizeRearDoors = 4.5; sizeFrontWind = 11.0; sizeRearWind = 6.5; sizeQuarter = 1.5;
                fitTime = "1.5 - 2 Hours";
            } else if (modelLower.indexOf("vitz") !== -1 || modelLower.indexOf("passo") !== -1 || modelLower.indexOf("swift") !== -1 || modelLower.indexOf("wagon") !== -1 || modelLower.indexOf("fit") !== -1 || modelLower.indexOf("aqua") !== -1) {
                bodyType = "Medium Hatchback / Compact SUV";
                seatCompat = "Compatible Covers: Vitz, Passo, Aqua, Fit GP5 (Bucket seat layout)";
                sizeFrontDoors = 6.0; sizeRearDoors = 5.5; sizeFrontWind = 13.0; sizeRearWind = 8.0; sizeQuarter = 2.0;
                fitTime = "2 - 3 Hours";
            } else if (modelLower.indexOf("vezel") !== -1 || modelLower.indexOf("grace") !== -1 || modelLower.indexOf("allion") !== -1 || modelLower.indexOf("premio") !== -1 || modelLower.indexOf("axio") !== -1 || modelLower.indexOf("civic") !== -1 || modelLower.indexOf("crv") !== -1) {
                bodyType = "Luxury Sedan / Full SUV";
                seatCompat = "Compatible Covers: Grace, Vezel, Axio, Allion Custom Tailored";
                sizeFrontDoors = 7.0; sizeRearDoors = 6.5; sizeFrontWind = 14.5; sizeRearWind = 9.5; sizeQuarter = 2.5;
                fitTime = "3 - 4 Hours";
            }

            var totalSqFt = 0;
            var selectedWindowsList = [];

            if (service !== "Seat Covers") {
                if (document.getElementById('chk-front-doors') && document.getElementById('chk-front-doors').checked) {
                    totalSqFt += sizeFrontDoors;
                    selectedWindowsList.push("Front Doors (2)");
                }
                if (document.getElementById('chk-rear-doors') && document.getElementById('chk-rear-doors').checked) {
                    totalSqFt += sizeRearDoors;
                    selectedWindowsList.push("Rear Doors (2)");
                }
                if (document.getElementById('chk-front-windshield') && document.getElementById('chk-front-windshield').checked) {
                    totalSqFt += sizeFrontWind;
                    selectedWindowsList.push("Front Windshield");
                }
                if (document.getElementById('chk-rear-windshield') && document.getElementById('chk-rear-windshield').checked) {
                    totalSqFt += sizeRearWind;
                    selectedWindowsList.push("Rear Windshield");
                }
                if (document.getElementById('chk-quarter-glasses') && document.getElementById('chk-quarter-glasses').checked) {
                    totalSqFt += sizeQuarter;
                    selectedWindowsList.push("Quarter Glasses");
                }
                if (document.getElementById('chk-sunroof') && document.getElementById('chk-sunroof').checked) {
                    totalSqFt += sizeSunroof;
                    selectedWindowsList.push("Sunroof Glass");
                }
            }

            var totalCost = totalSqFt * pricePerSqFt;
            var formattedCost = "LKR " + totalCost.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});

            currentEstimate = {
                model: model, 
                year: year, 
                service: service, 
                bodyType: bodyType, 
                seatCompat: seatCompat, 
                fitTime: fitTime,
                selectedWindows: selectedWindowsList.join(", ") || "None",
                totalSqFt: totalSqFt.toFixed(1),
                pricePerSqFt: pricePerSqFt,
                formattedCost: service === "Seat Covers" ? "LKR 25,000 - 45,000 (Based on Material)" : formattedCost
            };

            document.getElementById('res-doors').innerHTML = '<strong>🚗 Vehicle Profile:</strong> ' + bodyType + ' (' + model + ' ' + year + ')';
            
            if (service !== "Seat Covers") {
                document.getElementById('res-specs').innerHTML = '<strong>🪟 Selected Windows:</strong> ' + currentEstimate.selectedWindows;
                document.getElementById('res-area').innerHTML = '<strong>📐 Total Estimated Area:</strong> ' + currentEstimate.totalSqFt + ' Sq. Ft.';
                document.getElementById('res-price').innerHTML = '<strong>💰 Calculated Tinting Cost:</strong> <span style="color:#D4AF37; font-size:18px;">' + formattedCost + '</span> (@ LKR ' + pricePerSqFt + '/Sq. Ft.)';
            } else {
                document.getElementById('res-specs').innerHTML = '<strong>🪑 Seat Layout & Compatibility:</strong> ' + seatCompat;
                document.getElementById('res-area').innerHTML = '';
                document.getElementById('res-price').innerHTML = '<strong>💰 Estimated Seat Covers Price:</strong> <span style="color:#D4AF37; font-size:18px;">' + currentEstimate.formattedCost + '</span>';
            }

            document.getElementById('res-interchange').innerHTML = '<strong>⏱️ Estimated Fitting Time:</strong> ' + fitTime;
            document.getElementById('ai-result-box').style.display = "block";
        }

        function sendAnalysisToWhatsApp() {
            var msg = "*Mihinadee Motors - Vehicle Analysis & Quotation*%0A%0A" +
                      "*Vehicle:* " + currentEstimate.model + " (" + currentEstimate.year + ")%0A" +
                      "*Service:* " + currentEstimate.service + "%0A" +
                      "*Body Type:* " + currentEstimate.bodyType + "%0A";
            
            if (currentEstimate.service !== "Seat Covers") {
                msg += "*Selected Windows:* " + currentEstimate.selectedWindows + "%0A" +
                       "*Total Area:* " + currentEstimate.totalSqFt + " Sq. Ft.%0A" +
                       "*Price per Sq. Ft.:* LKR " + currentEstimate.pricePerSqFt + "%0A" +
                       "*Estimated Cost:* " + currentEstimate.formattedCost + "%0A";
            } else {
                msg += "*Compatibility:* " + currentEstimate.seatCompat + "%0A" +
                       "*Estimated Price:* " + currentEstimate.formattedCost + "%0A";
            }

            msg += "*Fitting Time:* " + currentEstimate.fitTime + "%0A%0A" +
                   "_Would you like to schedule an appointment for this?_";
            
            window.open("https://wa.me/94752541337?text=" + msg, '_blank');
        }
    </script>
</body>
</html>
